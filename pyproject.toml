[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[project]
name = "bloodyad-opsec"
authors = [
    { name="CravateRouge", email="baptiste@cravaterouge.com" },
]
maintainers = [
    { name="HexKnight" },
]
version = "0.1.0"
description = "Independent bloodyAD fork with scoped OPSEC safeguards and recovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND LicenseRef-Impacket AND WTFPL"
license-files = ["LICENSE"]
classifiers = [
        "Programming Language :: Python :: 3",
        "Operating System :: OS Independent",
]
dependencies = [
        "cryptography==44.0.2",
        "badldap>=0.7.6",
        "winacl==0.1.9",
        "asn1crypto==1.5.1",
        "ldap3==2.9.1",
        "kerbad>=0.5.10"
]

[project.urls]
"Homepage" = "https://github.com/Hexboi/bloodyAD-opsec"
"Upstream" = "https://github.com/CravateRouge/bloodyAD"

[project.scripts]
bloodyad-opsec = "bloodyAD.main:main"

[tool.hatch.build.targets.wheel]
packages = ["bloodyAD"]
